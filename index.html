<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Операционная книга · VKO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#EEF0F3; }
  body{ padding: 18px; min-height:100vh; }
  :root{
    --ink:#14171A;
    --ink-2:#1D2126;
    --paper:#FAFAF9;
    --paper-2:#FFFFFF;
    --amber:#F2B705;
    --bh:#E2472B;
    --bh-2:#F5B700;
    --mobar:#8A5A34;
    --mobar-2:#3C2A1E;
    --red-alert:#C1272D;
    --accent:#5457E5;
    --accent-ink:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F4F5F7;
    --line: rgba(20,23,26,0.09);
    --text-dim: rgba(20,23,26,0.5);
    --ok:#3FA34D;
    --wip:#F2B705;
    --todo: #D8DBDF;
    font-family: 'Inter', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  #opbook-root{
    background: var(--surface);
    color:var(--ink);
    min-height: 100%;
    display:flex;
    border-radius: 16px;
    overflow:hidden;
    border: 1px solid var(--line);
    box-shadow: 0 20px 45px -25px rgba(20,23,26,0.25);
    min-height: 640px;
  }
  .ob-mono{ font-family:'IBM Plex Mono', 'Courier New', monospace; letter-spacing: 0.02em; }
  .ob-display{ font-family:'Archivo Black', 'Arial Black', sans-serif; }

  /* ---------- SIDEBAR ---------- */
  .ob-side{
    width: 268px;
    flex-shrink:0;
    background: var(--surface-2);
    border-right: 1px solid var(--line);
    display:flex;
    flex-direction:column;
  }
  .ob-side-head{
    padding: 20px 18px 16px;
    border-bottom: 1px solid var(--line);
  }
  .ob-eyebrow{ font-size:10px; letter-spacing:0.18em; color:var(--accent); text-transform:uppercase; margin-bottom:6px; font-weight:700;}
  .ob-title{ font-size:17px; line-height:1.15; margin:0 0 8px; color:var(--ink); }
  .ob-progress-row{ display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-dim);}
  .ob-progress-track{ flex:1; height:4px; background:rgba(20,23,26,0.08); border-radius:2px; overflow:hidden;}
  .ob-progress-fill{ height:100%; background:var(--accent); transition:width .5s ease; }

  .ob-point-toggle{ display:flex; gap:6px; margin-top:12px; }
  .ob-point-btn{
    flex:1; font-size:11px; padding:8px 6px; border-radius:8px; border:1px solid var(--line);
    background:#fff; color:var(--text-dim); cursor:pointer; text-align:center;
    font-family:'Inter',sans-serif; font-weight:600; transition:all .15s ease;
  }
  .ob-point-btn.active.bh{ background:var(--bh); color:#fff; border-color:var(--bh); }
  .ob-point-btn.active.mobar{ background:var(--mobar); color:#fff; border-color:var(--mobar); }

  .ob-nav-group-label{ padding:14px 18px 4px; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); font-weight:600; }

  .ob-revenue-widget{
    display:flex; align-items:center; justify-content:space-between; margin-top:10px; padding:9px 12px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
  }
  .ob-revenue-label{ font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; font-weight:600;}
  .ob-revenue-val{ font-size:13px; font-weight:800; color:var(--ink); font-family:'IBM Plex Mono',monospace; }

  .ob-search-wrap{ position:relative; margin-top:10px; }
  .ob-search-input{
    width:100%; font-family:'Inter',sans-serif; font-size:12.5px; padding:9px 12px; border-radius:8px;
    border:1px solid var(--line); background:#fff; color:var(--ink); box-sizing:border-box;
  }
  .ob-search-input:focus{ outline:none; border-color:var(--accent); }
  .ob-search-results{
    position:absolute; top:calc(100% + 6px); left:0; right:0; background:#fff; border:1px solid var(--line);
    border-radius:10px; box-shadow:0 12px 28px -8px rgba(20,23,26,0.25); max-height:340px; overflow-y:auto; z-index:20;
  }
  .ob-search-result{
    display:block; width:100%; text-align:left; padding:9px 12px; background:none; border:none; cursor:pointer;
    border-bottom:1px solid rgba(20,23,26,0.05); font-family:'Inter',sans-serif;
  }
  .ob-search-result:last-child{ border-bottom:none; }
  .ob-search-result:hover{ background:var(--surface-2); }
  .ob-search-result-title{ font-size:12.5px; font-weight:600; color:var(--ink); }
  .ob-search-result-sub{ font-size:11px; color:var(--text-dim); margin-top:1px; }
  .ob-search-result-section{ font-size:9.5px; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin-top:2px; }
  .ob-search-empty{ padding:12px; font-size:12px; color:var(--text-dim); text-align:center; }

  .ob-stories{ display:flex; gap:12px; padding:2px 18px 14px; overflow-x:auto; }
  .ob-story-avatar{ flex-shrink:0; width:56px; text-align:center; cursor:pointer; background:none; border:none; color:var(--ink); }
  .ob-story-ring{ width:52px; height:52px; border-radius:50%; padding:2.5px; background:linear-gradient(135deg,var(--bh-2),var(--bh),#c2273a); margin:0 auto 4px; }
  .ob-story-ring img{ width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; border:2px solid var(--surface-2); }
  .ob-story-label{ font-size:9.5px; color:var(--text-dim); line-height:1.2; }

  .ob-story-overlay{
    position:fixed; inset:0; background:#000; z-index:9999;
    display:flex; align-items:center; justify-content:center;
  }
  .ob-story-frame{ position:relative; width:100%; height:100%; max-width:460px; max-height:100%; background:#000; }
  .ob-story-frame img{ width:100%; height:100%; object-fit:contain; display:block; background:#000; }
  .ob-story-progress{ position:absolute; top:10px; left:10px; right:10px; display:flex; gap:4px; z-index:2; }
  .ob-story-seg{ flex:1; height:2.5px; background:rgba(255,255,255,0.3); border-radius:2px; overflow:hidden; }
  .ob-story-seg-fill{ height:100%; width:0%; background:#fff; }
  .ob-story-seg.done .ob-story-seg-fill{ width:100%; }
  .ob-story-close{ position:absolute; top:16px; right:12px; z-index:2; background:rgba(0,0,0,0.4); color:#fff; border:none; width:30px; height:30px; border-radius:50%; font-size:16px; cursor:pointer; }
  .ob-story-caption{ position:absolute; left:0; right:0; bottom:0; padding:16px 18px 22px; background:linear-gradient(transparent, rgba(0,0,0,0.75)); color:#fff; font-size:13px; line-height:1.4; }
  .ob-story-tapzone{ position:absolute; top:0; bottom:0; width:40%; z-index:1; }
  .ob-story-tapzone.left{ left:0; }
  .ob-story-tapzone.right{ right:0; }

  .ob-menu-cover{ width:100%; max-width:420px; aspect-ratio:900/780; object-fit:cover; border-radius:14px; margin-bottom:14px; display:block; box-shadow:0 4px 14px -6px rgba(20,23,26,0.25); }

  .ob-nav{ flex:1; overflow-y:auto; padding: 8px 0; }
  .ob-nav-item{
    width:100%; display:flex; align-items:center; gap:10px;
    padding:10px 18px; background:none; border:none; cursor:pointer;
    color:var(--ink); text-align:left; border-left:3px solid transparent;
    font-size:13px;
  }
  .ob-nav-item:hover{ background:rgba(20,23,26,0.035); }
  .ob-nav-item.active{ background:#fff; border-left-color: var(--accent); color:var(--accent); font-weight:600; box-shadow: inset 0 0 0 1px var(--line); }
  .ob-nav-code{ font-size:11px; color:var(--text-dim); width:20px; flex-shrink:0; }
  .ob-nav-icon{ width:18px; text-align:center; flex-shrink:0; }
  .ob-nav-name{ flex:1; }
  .ob-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; background:var(--todo); }
  .ob-dot.ok{ background:var(--ok); }
  .ob-dot.wip{ background:var(--wip); }

  .ob-side-foot{ padding:12px 18px; border-top:1px solid var(--line); font-size:10px; color:var(--text-dim); }

  /* ---------- MAIN ---------- */
  .ob-main{ flex:1; background:var(--paper); color:var(--ink); display:flex; flex-direction:column; min-width:0; }
  .ob-board{
    background: var(--surface);
    color:var(--ink);
    padding: 16px 28px;
    display:flex; align-items:center; gap:16px;
    border-bottom: 1px solid var(--line);
  }
  .ob-flap{
    font-size: 22px; font-weight:800; letter-spacing:0.02em;
    background: var(--surface-2); border:1px solid var(--line); border-radius:8px;
    padding: 6px 12px; min-width:44px; text-align:center; color:var(--accent);
    font-family:'IBM Plex Mono',monospace;
  }
  .ob-flap span{ display:inline-block; }
  .ob-board-title{ font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); font-weight:600;}
  .ob-board-name{ font-size:19px; margin-top:2px; font-weight:700; }

  .ob-content{ padding: 26px 30px 40px; overflow-y:auto; }
  .ob-content-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
  .ob-status-chip{
    font-size:11px; padding:5px 10px; border-radius:20px; border:1px solid transparent;
    cursor:pointer; user-select:none; font-family:'Inter',sans-serif; font-weight:600;
  }
  .ob-status-chip.todo{ background:rgba(20,23,26,0.05); color:#555; border-color:rgba(20,23,26,0.1); }
  .ob-status-chip.wip{ background:#FFF3CC; color:#8a6900; border-color:#f0d675; }
  .ob-status-chip.ok{ background:#DFF3E2; color:#1f6b30; border-color:#a9dcb3; }

  .ob-section-desc{ font-size:13px; color:#666; max-width:560px; margin:0; }

  .ob-card{
    background: var(--paper-2); border:1px solid rgba(20,23,26,0.07); border-radius:14px;
    padding:16px 18px; margin-bottom:12px; box-shadow: 0 1px 2px rgba(20,23,26,0.03);
  }
  .ob-card-title{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:#8a8a90; font-weight:700; margin:0 0 10px;}

  .ob-check-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid rgba(20,23,26,0.05); font-size:14px;}
  .ob-check-row:last-child{ border-bottom:none;}
  .ob-check-row input{ width:17px; height:17px; accent-color: var(--accent); flex-shrink:0; }
  .ob-check-row.done label{ text-decoration:line-through; color:#999; }

  .ob-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap:12px; }
  .ob-contact{ background:var(--paper-2); border:1px solid rgba(20,23,26,0.07); border-radius:14px; padding:14px; box-shadow: 0 1px 2px rgba(20,23,26,0.03); }
  .ob-contact-role{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#8a8a90; }
  .ob-contact-name{ font-size:15px; font-weight:600; margin:3px 0 2px; }
  .ob-contact-phone{ font-size:13px; color:#666; }

  .ob-stat-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  .ob-stat{ background:var(--paper-2); border:1px solid rgba(20,23,26,0.07); border-radius:14px; padding:14px 16px; min-width:130px; box-shadow: 0 1px 2px rgba(20,23,26,0.03);}
  .ob-stat-val{ font-size:24px; font-weight:800; }
  .ob-stat-label{ font-size:11px; color:#8a8a90; text-transform:uppercase; letter-spacing:.06em;}

  .ob-hero{
    border-radius:18px; padding:28px 26px; margin-bottom:16px; color:#fff; position:relative; overflow:hidden;
  }
  .ob-hero-eyebrow{ font-size:11px; letter-spacing:0.12em; text-transform:uppercase; opacity:0.85; font-weight:700; margin-bottom:6px;}
  .ob-hero-title{ font-family:'Archivo Black','Arial Black',sans-serif; font-size:26px; line-height:1.15; margin:0 0 8px; max-width:520px;}
  .ob-hero-sub{ font-size:13.5px; opacity:0.92; max-width:480px; line-height:1.5; margin:0;}
  .ob-hero-founders{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .ob-hero-founder{ font-size:11.5px; background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.3); border-radius:20px; padding:5px 12px; }

  .ob-timeline{ position:relative; padding-left:26px; margin:6px 0 18px; }
  .ob-timeline::before{ content:''; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:linear-gradient(var(--accent), rgba(20,23,26,0.08)); }
  .ob-timeline-item{ position:relative; padding-bottom:20px; }
  .ob-timeline-item:last-child{ padding-bottom:0; }
  .ob-timeline-dot{ position:absolute; left:-26px; top:2px; width:13px; height:13px; border-radius:50%; background:var(--accent); border:3px solid var(--paper); box-shadow:0 0 0 1px var(--accent); }
  .ob-timeline-year{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--accent); font-weight:700; letter-spacing:0.04em; }
  .ob-timeline-title{ font-size:15px; font-weight:700; margin:2px 0 4px; }
  .ob-timeline-text{ font-size:13.5px; color:#555; line-height:1.55; max-width:600px; }

  .ob-signature-box{
    display:flex; align-items:center; gap:14px; background:var(--paper-2); border:1px solid rgba(20,23,26,0.07);
    border-radius:14px; padding:16px 18px; box-shadow:0 1px 2px rgba(20,23,26,0.03);
  }
  .ob-signature-icon{ font-size:30px; flex-shrink:0; }
  .ob-signature-label{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#8a8a90; font-weight:700; margin-bottom:3px;}
  .ob-signature-text{ font-size:14px; font-weight:600; }

  .ob-photo-placeholder{
    aspect-ratio:16/9; border-radius:14px; display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,0.7); font-size:12px; text-align:center; padding:16px; margin-bottom:16px;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.06) 0 2px, transparent 2px 14px);
  }
  .ob-source-list{ font-size:11px; color:#999; margin-top:4px; }
  .ob-source-list a{ color:#999; }

  .ob-rh-chart{ max-height:520px; overflow-y:auto; padding-right:4px; }
  .ob-rh-row{ display:flex; align-items:center; gap:10px; padding:5px 0; }
  .ob-rh-month{ width:130px; flex-shrink:0; font-size:11.5px; color:#555; font-family:'IBM Plex Mono',monospace; }
  .ob-rh-bar-track{ flex:1; background:rgba(20,23,26,0.05); border-radius:4px; height:16px; overflow:hidden; }
  .ob-rh-bar{ height:100%; background:var(--accent); border-radius:4px; transition:width .4s ease; }
  .ob-rh-bar.fm{ background:#d99a3d; }
  .ob-rh-bar.live{ background:repeating-linear-gradient(135deg, var(--accent), var(--accent) 8px, rgba(84,87,229,0.6) 8px, rgba(84,87,229,0.6) 16px); }
  .ob-rh-val{ width:110px; flex-shrink:0; text-align:right; font-size:12px; font-weight:700; font-family:'IBM Plex Mono',monospace; }

  .ob-team-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:12px; }
  .ob-team-card{
    background:var(--paper-2); border:1px solid rgba(20,23,26,0.07); border-radius:14px;
    padding:14px; box-shadow:0 1px 2px rgba(20,23,26,0.03);
  }
  .ob-team-top{ display:flex; align-items:flex-start; gap:10px; }
  .ob-team-avatar{
    width:38px; height:38px; border-radius:50%; flex-shrink:0; color:#fff; font-weight:700; font-size:13px;
    display:flex; align-items:center; justify-content:center;
  }
  .ob-team-name{ font-size:14px; font-weight:700; line-height:1.25; }
  .ob-team-role{ font-size:12px; color:#777; margin-top:1px; }
  .ob-team-status{ font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; flex-shrink:0; white-space:nowrap; }
  .ob-team-status.ok{ background:#DFF3E2; color:#1f6b30; }
  .ob-team-status.no{ background:#FBEAEA; color:#a13a17; }
  .ob-team-meta{ display:flex; flex-direction:column; gap:3px; margin-top:10px; padding-top:10px; border-top:1px solid rgba(20,23,26,0.06); font-size:11.5px; color:#666; }

  /* ---------- SPLASH (история при входе) ---------- */
  #ob-splash{
    position:fixed; inset:0; z-index:6000; overflow-y:auto;
    display:flex; align-items:center; justify-content:center; padding:40px 20px;
  }
  .ob-splash-card{
    max-width:640px; width:100%; background:#fff; border-radius:20px; overflow:hidden;
    box-shadow:0 30px 70px -20px rgba(0,0,0,0.4);
  }
  .ob-splash-hero{ padding:36px 34px 30px; color:#fff; }
  .ob-splash-eyebrow{ font-size:11px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.85; font-weight:700; margin-bottom:8px;}
  .ob-splash-title{ font-family:'Archivo Black','Arial Black',sans-serif; font-size:28px; line-height:1.18; margin:0 0 10px;}
  .ob-splash-sub{ font-size:13.5px; opacity:0.92; line-height:1.5; margin:0; max-width:480px;}
  .ob-splash-body{ padding:26px 34px 30px; }
  .ob-splash-continue{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    margin-top:22px; font-family:'Inter',sans-serif; font-weight:700; font-size:14px;
    background:var(--accent); color:#fff; border:none; border-radius:12px; padding:13px 20px; cursor:pointer;
  }
  .ob-splash-continue:hover{ filter:brightness(1.06); }
  .ob-splash-skip{
    display:block; text-align:center; margin-top:10px; font-size:12px; color:#999;
    background:none; border:none; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .ob-splash-skip:hover{ color:#666; }

  .ob-alert{ background:#FBEAEA; border:1px solid #E7B9BA; border-left:4px solid var(--red-alert); border-radius:8px; padding:14px 16px; margin-bottom:10px;}
  .ob-alert-title{ color:var(--red-alert); font-weight:700; font-size:13px; margin:0 0 4px;}

  .accent-bh .ob-board{ border-bottom:2px solid var(--bh-2); }
  .accent-bh .ob-status-chip.ok{ background:#FFE3D6; color:#a13a17; border-color:#f0b79b; }
  .accent-mobar .ob-board{ border-bottom:2px solid var(--mobar); }

  @media (max-width: 720px){
    #opbook-root{ flex-direction:column; border-radius:0; min-height:100vh; }
    .ob-side{ width:100%; flex-direction:row; align-items:center; }
    .ob-side-head{ display:none; }
    .ob-nav{ display:flex; overflow-x:auto; padding:10px; gap:4px; }
    .ob-nav-item{ flex-direction:column; width:auto; border-left:none; border-bottom:3px solid transparent; padding:8px 12px; gap:4px; white-space:nowrap;}
    .ob-nav-item.active{ border-bottom-color:var(--accent); border-left-color:transparent;}
    .ob-nav-name{ font-size:11px; }
    .ob-nav-code{ display:none; }
    .ob-side-foot{ display:none; }
    .ob-board{ padding:12px 16px; }
    .ob-flap{ font-size:22px; min-width:42px; padding:2px 6px;}
    .ob-content{ padding:18px 16px 30px; }
  }

  /* ---------- IDENTITY BAR (Cloudflare Access) ---------- */
  .ob-identity-bar{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 18px; border-top:1px solid var(--line); font-size:11px; color:var(--text-dim);
  }
  .ob-identity-email{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ob-logout-btn{
    font-family:'Inter',sans-serif; font-size:11px; color:var(--text-dim); text-decoration:none;
    background:#fff; border:1px solid var(--line); border-radius:6px;
    padding:5px 9px; cursor:pointer; white-space:nowrap; flex-shrink:0;
  }
  .ob-logout-btn:hover{ color:var(--ink); border-color:rgba(20,23,26,0.2); }
</style>
</head>
<body>

<div id="opbook-root">
  <aside class="ob-side">
    <div class="ob-side-head">
      <div class="ob-eyebrow">VKO · Терминал A</div>
      <h1 class="ob-title ob-display">ОПЕРАЦИОННАЯ<br/>КНИГА</h1>
      <div class="ob-progress-row">
        <span id="ob-progress-text">0/5</span>
        <div class="ob-progress-track"><div class="ob-progress-fill" id="ob-progress-fill" style="width:0%"></div></div>
      </div>
      <div class="ob-point-toggle">
        <button class="ob-point-btn bh" id="ob-point-bh">🍔 Burger Heroes</button>
        <button class="ob-point-btn mobar" id="ob-point-mobar">🍹 Мо Бар</button>
      </div>
      <div class="ob-revenue-widget" id="ob-revenue-widget" style="display:none;">
        <span class="ob-revenue-label" id="ob-revenue-label">Выручка</span>
        <span class="ob-revenue-val" id="ob-revenue-val">—</span>

  function fetchSheetJSONP(sheetId, sheetName){
    return new Promise((resolve, reject)=>{
      const cbName = 'obCb_' + Math.random().toString(36).slice(2,10);
      const url = 'https://docs.google.com/spreadsheets/d/' + sheetId +
        '/gviz/tq?tqx=out:json;responseHandler:' + cbName + '&sheet=' + encodeURIComponent(sheetName) + '&headers=0&_=' + Date.now();
      let settled = false;
      const script = document.createElement('script');
      const cleanup = ()=>{ try{ window[cbName] = undefined; delete window[cbName]; }catch(e){} if(script.parentNode) script.parentNode.removeChild(script); };
      window[cbName] = function(json){
        if(settled) return; settled = true;
        cleanup();
        resolve(json);
      };
      script.src = url;
      script.onerror = function(){
        if(settled) return; settled = true;
        cleanup();
        reject(new Error('Скрипт не загрузился — проверь, что таблица доступна по ссылке'));
      };
      document.body.appendChild(script);
      setTimeout(()=>{
        if(settled) return; settled = true;
        cleanup();
        reject(new Error('Таймаут запроса (8с) — Google не ответил'));
      }, 8000);
    });
  }

  function cleanCell(s){
    return s.replace(/[\u200B-\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/g, '').trim();
  }

  function jsonToRows(json){
    if(!json || !json.table || !json.table.rows) throw new Error('Пустой ответ от Google Sheets');
    return json.table.rows.map(r => (r.c||[]).map(cell=>{
      if(!cell) return '';
      if(cell.f !== undefined && cell.f !== null) return cleanCell(String(cell.f));
      if(cell.v !== undefined && cell.v !== null) return cleanCell(String(cell.v));
      return '';
    }));
  }

  function findCol(headerRow, keywords){
    for(let i=0;i<headerRow.length;i++){
      const h = (headerRow[i]||'').toLowerCase();
      if(keywords.every(k=>h.includes(k))) return i;
    }
    return -1;
  }

  function parseNum(v){
    if(v===undefined || v===null) return NaN;
    const cleaned = String(v).replace(/\s/g,'').replace(',', '.').replace(/[^\d.\-]/g,'');
    if(cleaned==='') return NaN;
    return Number(cleaned);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  }

  function fmtNum(n, decimals){
    if(n===null || n===undefined || isNaN(n)) return '—';
    return n.toLocaleString('ru-RU', { maximumFractionDigits: decimals!==undefined?decimals:0, minimumFractionDigits:0 });
  }

  function avg(arr){
    const vals = arr.filter(v=>!isNaN(v));
    if(!vals.length) return null;
    return vals.reduce((a,b)=>a+b,0)/vals.length;
  }

  async function loadFinanceDataForSheet(sheetName){
    const json = await fetchSheetJSONP(REVENUE_SHEET_ID, sheetName);
    if(json.status === 'error'){
      const msg = (json.errors && json.errors[0] && (json.errors[0].detailed_message || json.errors[0].message)) || 'Google Sheets вернул ошибку';
      throw new Error(msg);
    }
    const rows = jsonToRows(json);

    // Подтверждено на реальных данных: дневная строка = 15 колонок в фиксированном порядке
    // 0:№ 1:Дата 2:День 3:Выручка 4:Чеки 5:Ср.чек 6:План1(руб) 7:План2(руб) 8:СПП 9:✓П1 10:✓П2 11:Паспоток 12:%конв 13:ДоПлана1 14:ДоПлана2
    const COL = { date:1, revenue:3, checks:4, avgCheck:5, plan1Rev:6, spp:8, passengers:11 };
    const dateRe = /^\d{1,2}[.\/]\d{1,2}$/;
    const dailyRows = rows.filter(r => dateRe.test((r[COL.date]||'').trim()));
    const filledRows = dailyRows.filter(r => (r[COL.revenue]||'').trim() !== '');

    const totalRevenue = filledRows.reduce((s,r)=> s + (parseNum(r[COL.revenue])||0), 0);
    const totalChecks = filledRows.reduce((s,r)=> s + (parseNum(r[COL.checks])||0), 0);
    const totalPlan1Rev = filledRows.reduce((s,r)=> s + (parseNum(r[COL.plan1Rev])||0), 0);
    const avgCheck = totalChecks>0 ? totalRevenue/totalChecks : avg(filledRows.map(r=>parseNum(r[COL.avgCheck])));
    const avgSPP = avg(filledRows.map(r=>parseNum(r[COL.spp])));
    const avgPassengers = avg(filledRows.map(r=>parseNum(r[COL.passengers])));
    const percentPlan1 = totalPlan1Rev>0 ? (totalRevenue/totalPlan1Rev*100) : null;
    const lastFilledDate = filledRows.length ? filledRows[filledRows.length-1][COL.date] : null;
    const lastDayRevenue = filledRows.length ? (parseNum(filledRows[filledRows.length-1][COL.revenue])||0) : null;

    const headerRow = rows[2] || [];
    const plan1RateMatch = (headerRow[COL.plan1Rev]||'').match(/(\d+(?:[.,]\d+)?)/);
    const plan1Rate = plan1RateMatch ? parseNum(plan1RateMatch[1]) : null;

    const debug = { totalRows: rows.length, dailyCount: dailyRows.length, filledCount0: filledRows.length, sampleDaily: dailyRows.slice(0,3) };

    return { totalRevenue, totalChecks, avgCheck, avgSPP, avgPassengers, plan1Rate, percentPlan1, lastFilledDate, lastDayRevenue, filledCount: filledRows.length, fetchedAt: new Date(), debug };
  }

  function wireSearch(){
    const input = document.getElementById('ob-search-input');
    const results = document.getElementById('ob-search-results');
    const index = buildSearchIndex();

    function render(query){
      const q = query.trim().toLowerCase();
      if(!q){ results.style.display = 'none'; results.innerHTML = ''; return; }
      const matches = index.filter(item =>
        item.title.toLowerCase().includes(q) || (item.sub && item.sub.toLowerCase().includes(q))
      ).slice(0, 8);
      if(!matches.length){
        results.innerHTML = `<div class="ob-search-empty">Ничего не найдено по «${escapeHtml(query)}»</div>`;
      } else {
        results.innerHTML = matches.map(m=>{
          const sectionName = (SECTIONS.find(s=>s.id===m.sectionId)||{}).name || '';
          return `<button class="ob-search-result" data-section="${m.sectionId}">
            <div class="ob-search-result-title">${escapeHtml(m.title)}</div>
            ${m.sub ? `<div class="ob-search-result-sub">${escapeHtml(m.sub)}</div>` : ''}
            <div class="ob-search-result-section">${escapeHtml(sectionName)}</div>
          </button>`;
        }).join('');
        results.querySelectorAll('.ob-search-result').forEach(btn=>{
          btn.onclick = ()=>{
            selectSection(btn.dataset.section);
            input.value = '';
            results.style.display = 'none';
            input.blur();
          };
        });
      }
      results.style.display = 'block';
    }

    input.addEventListener('input', ()=> render(input.value));
    input.addEventListener('focus', ()=> { if(input.value.trim()) render(input.value); });
    input.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ input.value=''; results.style.display='none'; input.blur(); } });
    document.addEventListener('click', (e)=>{
      if(!e.target.closest('.ob-search-wrap')) results.style.display = 'none';
    });
  }

  function openStoryViewer(photos){
    if(!photos.length) return;
    let idx = 0;
    let timer = null;
    const overlayRoot = document.getElementById('ob-story-overlay');
    const DURATION = 4500;

    function render(){
      overlayRoot.innerHTML = `
        <div class="ob-story-overlay">
          <div class="ob-story-frame">
            <div class="ob-story-progress" id="ob-story-progress"></div>
            <button class="ob-story-close" id="ob-story-close">✕</button>
            <img src="${photos[idx].src}" />
            <div class="ob-story-tapzone left" id="ob-story-prev"></div>
            <div class="ob-story-tapzone right" id="ob-story-next"></div>
            <div class="ob-story-caption">${photos[idx].caption||''}</div>
          </div>
        </div>`;
      const progWrap = document.getElementById('ob-story-progress');
      progWrap.innerHTML = photos.map((_,i)=>`<div class="ob-story-seg ${i<idx?'done':''}" data-i="${i}"><div class="ob-story-seg-fill" id="ob-seg-fill-${i}"></div></div>`).join('');
      document.getElementById('ob-story-close').onclick = close;
      document.getElementById('ob-story-prev').onclick = ()=> go(idx-1);
      document.getElementById('ob-story-next').onclick = ()=> go(idx+1);
      startTimer();
    }
    function startTimer(){
      clearTimer();
      const fill = document.getElementById('ob-seg-fill-'+idx);
      if(fill){ fill.style.transition = 'none'; fill.style.width='0%'; requestAnimationFrame(()=>{ fill.style.transition = 'width '+DURATION+'ms linear'; fill.style.width='100%'; }); }
      timer = setTimeout(()=> go(idx+1), DURATION);
    }
    function clearTimer(){ if(timer) clearTimeout(timer); timer=null; }
    function go(n){
      if(n < 0){ return; }
      if(n >= photos.length){ close(); return; }
      idx = n;
      render();
    }
    function close(){ clearTimer(); overlayRoot.innerHTML=''; }
    render();
  }

    wrap.className='ob-dynamic';
    wrap.innerHTML = roles.map((r,ri)=>`

        <summary style="cursor:pointer;font-weight:600;font-size:13px;padding:6px 0;">${r.role}</summary>
        <div style="margin-top:6px;" data-role="${ri}"></div>
      </details>`).join('');
    body.appendChild(wrap);

    roles.forEach((r, ri)=>{
      const roleEl = wrap.querySelector(`[data-role="${ri}"]`);
      r.sections.forEach(async (sec, si)=>{
        const key = `opbook:checklist:${currentPoint}:${ri}:${si}`;
        let saved = {};
        try{ const res = await window.storage.get(key, true); saved = res ? JSON.parse(res.value) : {}; }catch(e){ saved = {}; }
        const secEl = document.createElement('div');
        secEl.style.cssText='margin-bottom:10px;';
        secEl.innerHTML = `<p style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#8a8a80;margin:8px 0 4px;">${sec.title}</p>` +
          sec.items.map((t,i)=>`
            <div class="ob-check-row ${saved[i]?'done':''}" data-i="${i}" style="padding:6px 0;">
              <input type="checkbox" id="${key}-${i}" ${saved[i]?'checked':''}/>
              <label for="${key}-${i}" style="font-size:13px;">${t}</label>
            </div>`).join('');
        roleEl.appendChild(secEl);
        secEl.querySelectorAll('input[type=checkbox]').forEach(inp=>{
          inp.addEventListener('change', async (e)=>{
            const i = e.target.closest('.ob-check-row').dataset.i;
            saved[i] = e.target.checked;
            e.target.closest('.ob-check-row').classList.toggle('done', e.target.checked);
            try{ await window.storage.set(key, JSON.stringify(saved), true); }catch(err){}
          });
        });
      });
    });
  }

  function normStatus(s){
    s = (s||'').trim();
    if(!s) return '—';
    if(/не\s*оформлен/i.test(s)) return '❌ Не оформлен';
    if(/оформлен/i.test(s)) return '✅ Оформлен';
    return s;
  }

  const TEAM_SHEET_CANDIDATES = {
    mobar: ['Мо - Бар', 'Мо -Бар', 'Мо- Бар', 'Мо-Бар', 'Мо - Бар '],
    bh: ['БХ', 'БХ ', ' БХ', 'Бх', 'БХ VKO', 'Burger Heroes'],
  };

  function looksLikeValidTeamRows(rows){
    return rows.some(r => r.join(' ').match(/оформлен/i)) &&
           rows.some(r => /^\d+$/.test((r[0]||'').trim()));
  }

  async function loadTeamData(point){
    const col = TEAM_COLS[point];
    const candidates = TEAM_SHEET_CANDIDATES[point];
    let rows = null, lastErr = null, usedName = null;
    for(const name of candidates){
      try{
        const json = await fetchSheetJSONP(TEAM_SHEET_ID, name);
        if(json.status === 'error'){ lastErr = new Error((json.errors&&json.errors[0]&&json.errors[0].detailed_message)||'Sheets error'); continue; }
        const r = jsonToRows(json);
        if(looksLikeValidTeamRows(r)){ rows = r; usedName = name; break; }
        lastErr = new Error('Лист «'+name+'» найден, но не похож на список сотрудников');
      }catch(e){ lastErr = e; }
    }
    if(!rows) throw (lastErr || new Error('Не нашли подходящий лист'));

    const list = [];
    rows.forEach(row=>{
      const num = (row[col.num]||'').trim();
      const name = (row[col.name]||'').trim();
      if(!/^\d+$/.test(num)) return;
      if(!name || name.length < 3 || /^(бх|рф|мо\s*бар)$/i.test(name)) return;
      list.push({
        name,
        role: (row[col.role]||'').trim() || '—',
        phone: (row[col.phone]||'').trim() || '—',
        status: normStatus(row[col.status]),
        hireDate: (row[col.hireDate]||'').trim() || '—',
        tenure: (row[col.tenureText]||'').trim() || '—',
        citizenship: (row[col.citizenship]||'').trim() || '—',
      });
    });
    return { list, debug: { usedSheetName: usedName, totalRows: rows.length, sample: rows.slice(0,8) } };
  }

  async function renderFinance(){
    const body = document.getElementById('ob-body');
    body.innerHTML = '';
    const point = currentPoint;
    const wrap = document.createElement('div');
    wrap.className='ob-dynamic';
    wrap.innerHTML = `<div class="ob-card"><p class="ob-card-title">Загрузка...</p><p style="font-size:13px;color:#555;margin:0;">Тяну данные из таблицы «${REVENUE_SHEET_NAMES[point]}»...</p></div>`;
    body.appendChild(wrap);

    function planColor(pct){
      if(pct===null) return '#555';
      return pct>=100 ? '#1f6b30' : pct>=85 ? '#8a6900' : '#a13a17';
    }

    function paint(data, errMsg, fromCache){
      if(currentPoint !== point || activeId !== 'finance') return;
      if(errMsg){
        wrap.innerHTML = `
          <div class="ob-card">
            <p class="ob-card-title">Не удалось подтянуть данные</p>
            <p style="font-size:13px;color:#555;margin:0 0 6px;">Причина: <span class="ob-mono">${errMsg}</span></p>
            <p style="font-size:13px;color:#555;margin:0 0 8px;">Загрузка идёт через служебный запрос Google Sheets по названию листа «${REVENUE_SHEET_NAMES[point]}». Если название листа менялось — обнови его в коде книги. Если доступ «Все, у кого есть ссылка» вдруг слетел — проверь его в исходном файле.</p>
            <p style="font-size:13px;margin:0;"><a href="https://docs.google.com/spreadsheets/d/${REVENUE_SHEET_ID}/edit" target="_blank" style="color:${point==='bh'?'#a13a17':'var(--mobar-2)'};font-weight:700;">👉 Открыть таблицу вручную</a></p>
            <button id="ob-fin-retry" style="margin-top:10px;font-size:12px;padding:6px 12px;border-radius:6px;border:1px solid rgba(0,0,0,0.15);background:#fff;cursor:pointer;">↻ Повторить</button>
          </div>`;
        document.getElementById('ob-fin-retry').onclick = ()=>{ delete financeCache[point]; renderFinance(); };
        return;
      }
      const time = data.fetchedAt.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
      const pct = data.percentPlan1;
      wrap.innerHTML = `
        <div class="ob-card">
          <p class="ob-card-title">Live · ${REVENUE_SHEET_NAMES[point]} <span style="text-transform:none;color:#aaa;">· обновлено ${time}${fromCache?' (кэш)':''}${data.lastFilledDate?(' · данные по ' + data.lastFilledDate):''}</span></p>
          <p style="font-size:13px;margin:0;"><a href="https://docs.google.com/spreadsheets/d/${REVENUE_SHEET_ID}/edit" target="_blank" style="color:${point==='bh'?'#a13a17':'var(--mobar-2)'};font-weight:700;">👉 Открыть таблицу</a>
          &nbsp;·&nbsp; <button id="ob-fin-refresh" style="font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid rgba(0,0,0,0.15);background:#fff;cursor:pointer;">↻ Обновить</button></p>
        </div>
        <div class="ob-stat-row">
          <div class="ob-stat"><div class="ob-stat-val">${fmtNum(data.totalRevenue)}</div><div class="ob-stat-label">Выручка за месяц</div></div>
          <div class="ob-stat"><div class="ob-stat-val">${fmtNum(data.avgSPP,1)}</div><div class="ob-stat-label">Средний СПП, ₽/пасс</div></div>
          <div class="ob-stat"><div class="ob-stat-val">${fmtNum(data.avgPassengers)}</div><div class="ob-stat-label">Средний пассажиропоток</div></div>
        </div>
        <div class="ob-stat-row">
          <div class="ob-stat"><div class="ob-stat-val">${fmtNum(data.avgCheck)}</div><div class="ob-stat-label">Средний чек</div></div>
          <div class="ob-stat"><div class="ob-stat-val" style="color:${planColor(pct)}">${pct!==null?fmtNum(pct,0)+'%':'—'}</div><div class="ob-stat-label">Выполнение Плана 1${data.plan1Rate?(' ('+data.plan1Rate+'₽/пасс)'):''}</div></div>
        </div>
        ${data.filledCount===0?'<p style="font-size:12px;color:#8a8a80;">За этот месяц ещё нет заполненных дней в таблице.</p>':''}
        <details style="margin-top:14px;font-size:11px;color:#777;">
          <summary style="cursor:pointer;font-weight:600;">🔧 Диагностика (временно, чтобы найти проблему)</summary>
          <div class="ob-mono" style="white-space:pre-wrap;background:#111;color:#9f9;padding:10px;border-radius:6px;margin-top:6px;font-size:10px;line-height:1.5;overflow-x:auto;">${escapeHtml(JSON.stringify(data.debug, null, 2))}</div>
        </details>`;
      document.getElementById('ob-fin-refresh').onclick = ()=>{ delete financeCache[point]; renderFinance(); };
    }

    if(financeCache[point] && financeCache[point] !== 'error'){ paint(financeCache[point], null, true); }
    try{
      const data = await loadFinanceData(point);
      financeCache[point] = data;
      paint(data, null, false);
    }catch(e){
      if(!financeCache[point]) paint(null, e.message || String(e), false);
    }
  }

  // Рекорд выручки за день по точке — обновляется вручную владельцем,
  // не привязан к тому, заморожен месяц в REVENUE_HISTORY или ещё живой.
  const DAY_RECORDS = {
    bh: { value:1001882, date:"18.08.2026 (вт)" },
    mobar: { value:538623, date:"18.08.2026 (вт)" },
  };

  function parseRuMonthLabel(label){
    const parts = label.trim().split(/\s+/);
    const year = parseInt(parts[1], 10);
    const monthIdx = RU_MONTHS.indexOf(parts[0].toUpperCase());
    return { year, monthIdx };
  }

  function ruMonthLabel(monthIdx, year){
    const name = RU_MONTHS[monthIdx];
    return name.charAt(0) + name.slice(1).toLowerCase() + ' ' + year;
  }

  function sheetNameForMonth(point, monthIdx, year){
    const name = RU_MONTHS[monthIdx];
    return point==='bh' ? `БХ ${name} ${year}` : `МО БАР ${name} ${year}`;
  }

  // Список месяцев от (последний зафиксированный в REVENUE_HISTORY + 1) по текущий включительно.
  // Каждый из них подтягиваем живьём — так раздел сам "доезжает" до сегодняшнего месяца,
  // даже если закрывшийся месяц забыли внести в REVENUE_HISTORY вручную.
  function computeGapMonths(point){
    const history = REVENUE_HISTORY[point];
    if(!history || !history.length) return [];
    let { year, monthIdx } = parseRuMonthLabel(history[history.length-1].month);
    const now = new Date();
    const curMonthIdx = now.getMonth();
    const curYear = now.getFullYear();
    const gaps = [];
    monthIdx++; if(monthIdx>11){ monthIdx=0; year++; }
    while(year<curYear || (year===curYear && monthIdx<=curMonthIdx)){
      gaps.push({
        month: ruMonthLabel(monthIdx, year),
        sheetName: sheetNameForMonth(point, monthIdx, year),
        isCurrent: year===curYear && monthIdx===curMonthIdx,
      });
      monthIdx++; if(monthIdx>11){ monthIdx=0; year++; }
    }
    return gaps;
  }

  async function renderRevenueHistory(){
    const body = document.getElementById('ob-body');
    const point = currentPoint;
    const history = REVENUE_HISTORY[point];
    if(!history){
      const empty = document.createElement('div');
      empty.className = 'ob-card';
      empty.innerHTML = `<p class="ob-card-title">История выручки · ${POINT_LABEL[point]}</p>
        <p style="font-size:13px;color:#666;margin:0;">Данных пока нет — как только владелец пришлёт историю выручки ${POINT_LABEL[point]}, здесь появится такой же дашборд, как у Burger Heroes.</p>`;
      body.appendChild(empty);
      return;
    }

    const loading = document.createElement('p');
    loading.id = 'ob-rh-loading';
    loading.style.cssText = 'font-size:12px;color:#999;margin:0 0 10px;';
    loading.textContent = 'Подтягиваю ещё не зафиксированные месяцы живьём из таблицы…';
    body.appendChild(loading);

    const rows = history.slice();
    const gapMonths = computeGapMonths(point);

    function paintDashboard(liveRows, failedMonths){
      if(currentPoint !== point || activeId !== 'revenue_history') return;
      loading.remove();
      const allRows = rows.concat(liveRows);
      const maxRevenue = Math.max(...allRows.map(r=>r.revenue||0));
      const last = allRows[allRows.length-1];
      const prev = allRows[allRows.length-2];
      const growthPct = (prev && prev.revenue) ? ((last.revenue-prev.revenue)/prev.revenue*100) : null;
      const lastIsLive = liveRows.length>0;

      const stats = document.createElement('div');
      stats.className = 'ob-stat-row';
      stats.innerHTML = `
        <div class="ob-stat"><div class="ob-stat-val">${fmtNum(last.revenue)} ₽</div><div class="ob-stat-label">Выручка · ${last.month}${lastIsLive?' (идёт)':''}</div></div>
        <div class="ob-stat"><div class="ob-stat-val">${last.avgCheck?fmtNum(last.avgCheck)+' ₽':'—'}</div><div class="ob-stat-label">Средний чек</div></div>
        <div class="ob-stat"><div class="ob-stat-val">${last.avgSPP?fmtNum(last.avgSPP,1):'—'}</div><div class="ob-stat-label">Средний СПП, ₽/пасс</div></div>
        <div class="ob-stat"><div class="ob-stat-val" style="color:${growthPct==null?'inherit':(growthPct>=0?'#1f6b30':'#a13a17')}">${growthPct==null?'—':(growthPct>=0?'+':'')+fmtNum(growthPct,1)+'%'}</div><div class="ob-stat-label">Рост к пред. месяцу</div></div>
      `;
      body.appendChild(stats);

      const chartCard = document.createElement('div');
      chartCard.className = 'ob-card';
      chartCard.innerHTML = `<p class="ob-card-title">Выручка по месяцам</p>
        <div class="ob-rh-chart">
          ${allRows.map((r)=>{
            const pct = maxRevenue>0 ? Math.max(4, r.revenue/maxRevenue*100) : 0;
            const isLive = !!r.isCurrent;
            return `<div class="ob-rh-row">
              <div class="ob-rh-month">${escapeHtml(r.month)}${r.forceMajeure?' ⚠️':''}${isLive?' 🔴':''}</div>
              <div class="ob-rh-bar-track"><div class="ob-rh-bar ${r.forceMajeure?'fm':''} ${isLive?'live':''}" style="width:${pct}%"></div></div>
              <div class="ob-rh-val">${fmtNum(r.revenue)} ₽</div>
            </div>`;
          }).join('')}
        </div>`;
      body.appendChild(chartCard);

      // Автозаметки — считаются из самих данных, ничего не придумываем. Текущий незакрытый месяц в них не участвует.
      const closedRows = lastIsLive && liveRows[liveRows.length-1].isCurrent ? allRows.slice(0, allRows.length-1) : allRows;
      const best = closedRows.reduce((a,b)=> (b.revenue>a.revenue?b:a), closedRows[0]);
      const worst = closedRows.reduce((a,b)=> (b.revenue<a.revenue?b:a), closedRows[0]);
      const fmMonths = closedRows.filter(r=>r.forceMajeure).map(r=>r.month);
      const first = closedRows[0];
      const totalGrowth = first.revenue>0 ? ((closedRows[closedRows.length-1].revenue-first.revenue)/first.revenue*100) : null;

      const notesCard = document.createElement('div');
      notesCard.className = 'ob-card';
      let notesHtml = `<p class="ob-card-title">Комментарии</p><ul style="margin:0;padding-left:18px;font-size:13px;color:#444;line-height:1.7;">
        <li>🏆 Лучший месяц по выручке — <b>${escapeHtml(best.month)}</b>: ${fmtNum(best.revenue)} ₽</li>
        <li>📉 Самый слабый месяц — <b>${escapeHtml(worst.month)}</b>: ${fmtNum(worst.revenue)} ₽</li>
        ${totalGrowth!=null ? `<li>📈 С ${escapeHtml(first.month)} по ${escapeHtml(closedRows[closedRows.length-1].month)} выручка выросла с ${fmtNum(first.revenue)} ₽ до ${fmtNum(closedRows[closedRows.length-1].revenue)} ₽ (${totalGrowth>=0?'+':''}${fmtNum(totalGrowth,1)}%)</li>` : ''}
        ${fmMonths.length ? `<li>⚠️ Форс-мажор фиксировался в: ${fmMonths.map(escapeHtml).join(', ')} — выручка в эти месяцы просела относительно плана</li>` : ''}
      `;
      const record = DAY_RECORDS[point];
      if(record){
        notesHtml += `<li>🔥 Рекорд выручки за день — ${fmtNum(record.value)} ₽ (${escapeHtml(record.date)})</li>`;
      }
      notesHtml += `</ul>`;
      notesCard.innerHTML = notesHtml;
      body.appendChild(notesCard);

      if(liveRows.length){
        const note = document.createElement('p');
        note.style.cssText = 'font-size:11px;color:#999;margin-top:4px;';
        const closedLive = liveRows.filter(r=>!r.isCurrent).map(r=>r.month);
        let text = '';
        if(closedLive.length) text += `${closedLive.join(', ')} уже закрыт${closedLive.length>1?'ы':''}, но пока не занесён${closedLive.length>1?'ы':''} в постоянную историю — цифры подтянуты живьём. `;
        text += `${last.month}${lastIsLive?' ещё не закрыт':''} — обновляется из той же таблицы, что и раздел «Финансы».`;
        note.textContent = text;
        body.appendChild(note);
      }
      if(failedMonths.length){
        const warn = document.createElement('p');
        warn.style.cssText = 'font-size:11px;color:#a13a17;margin-top:4px;';
        warn.textContent = `Не удалось подтянуть: ${failedMonths.join(', ')} — либо вкладки с таким названием нет в таблице, либо не удалось получить данные.`;
        body.appendChild(warn);
      }
    }

    if(!gapMonths.length){
      paintDashboard([], []);
      return;
    }

    const results = await Promise.allSettled(gapMonths.map(g => loadFinanceDataForSheet(g.sheetName)));
    const liveRows = [];
    const failedMonths = [];
    results.forEach((res, i) => {
      const g = gapMonths[i];
      if(res.status === 'fulfilled'){
        liveRows.push({ month:g.month, revenue:res.value.totalRevenue, checks:res.value.totalChecks, avgCheck:res.value.avgCheck, avgSPP:res.value.avgSPP, forceMajeure:false, isLive:true, isCurrent:g.isCurrent });
      } else {
        failedMonths.push(g.month);
      }
    });
    paintDashboard(liveRows, failedMonths);
  }

      ["День 4","Стандарты сервиса: встреча гостя, скрипты, работа с жалобами","Ролевая игра с наставником"],
      ["День 5","Санитарные нормы: гигиена, хранение продуктов, ХАССП","Тест по санитарии"],
      ["День 6–7","Самостоятельная работа под наблюдением наставника","Оценка наставника (5-балльная)"],
      ["День 14","Промежуточная аттестация по итогам 2 недель","Аттестационный лист"],
      ["День 30","Итоговая аттестация. Решение о прохождении ИС","Приказ о прохождении ИС"],
    ];
    const wrap = document.createElement('div');
    wrap.className='ob-card ob-dynamic';
    wrap.innerHTML = `<p class="ob-card-title">План стажировки нового сотрудника</p>` + plan.map(p=>`
      <div style="padding:10px 0;border-bottom:1px solid rgba(0,0,0,0.06);">
        <div style="font-weight:600;font-size:13px;">${p[0]} — ${p[1]}</div>
        <div style="font-size:12px;color:#777;margin-top:2px;">Проверка: ${p[2]}</div>
      </div>`).join('');
    body.appendChild(wrap);
  }

  document.getElementById('ob-point-bh').onclick = ()=> setPoint('bh');
  document.getElementById('ob-point-mobar').onclick = ()=> setPoint('mobar');
  setPoint('bh');
  loadStatuses().then(()=> selectSection(activeId));
  wireSearch();

  function showSplash(point){
    const data = POINT_HISTORY[point];
    if(!data) return;
    const heroGradient = point==='bh'
      ? "linear-gradient(135deg,rgba(226,71,43,0.85),rgba(194,39,58,0.9)), url('images/bh/photo2.jpg') center/cover no-repeat"
      : 'linear-gradient(135deg,#c9a06a,var(--mobar),var(--mobar-2))';
    const splash = document.createElement('div');
    splash.id = 'ob-splash';
    splash.innerHTML = `
      <div class="ob-splash-card">
        <div class="ob-splash-hero" style="background:${heroGradient}">
          <div class="ob-splash-eyebrow">${escapeHtml(data.eyebrow)}</div>
          <h1 class="ob-splash-title">${escapeHtml(data.title)}</h1>
          <p class="ob-splash-sub">${escapeHtml(data.sub)}</p>
        </div>
        <div class="ob-splash-body">
          <div class="ob-timeline">
            ${data.timeline.map(t => `
              <div class="ob-timeline-item">
                <div class="ob-timeline-dot"></div>
                <div class="ob-timeline-year">${escapeHtml(t.year)}</div>
                <div class="ob-timeline-title">${escapeHtml(t.title)}</div>
                <div class="ob-timeline-text">${escapeHtml(t.text)}</div>
              </div>
            `).join('')}
          </div>
          <div class="ob-signature-box">
            <div class="ob-signature-icon">${data.signatureIcon}</div>
            <div>
              <div class="ob-signature-label">Визитная карточка</div>
              <div class="ob-signature-text">${escapeHtml(data.signatureText)}</div>
            </div>
          </div>
          <button class="ob-splash-continue" id="ob-splash-continue">Продолжить в книгу →</button>
          <button class="ob-splash-skip" id="ob-splash-skip">Пропустить</button>
        </div>
      </div>
    `;
    document.body.appendChild(splash);
    const close = ()=> splash.remove();
    document.getElementById('ob-splash-continue').onclick = close;
    document.getElementById('ob-splash-skip').onclick = close;
  }
})();
</script>

<script>
  // ---------- CLOUDFLARE ACCESS IDENTITY ----------
  // The site itself is gated at the edge by Cloudflare Access (invite-only,
  // email one-time-code login) — there is nothing to enforce here. This just
  // reads who's logged in and shows an email + logout link in the sidebar.
  // On any origin not sitting behind Access (e.g. local dev) the fetch
  // below fails silently and the app renders exactly the same, minus the bar.
  (function(){
    fetch('/cdn-cgi/access/get-identity', { credentials: 'include' })
      .then(r => r.ok ? r.json() : null)
      .then(identity => {
        if(!identity || !identity.email) return;
        const bar = document.getElementById('ob-identity-bar');
        const emailEl = document.getElementById('ob-identity-email');
        emailEl.textContent = identity.email;
        emailEl.title = identity.email;
        bar.style.display = 'flex';
      })
      .catch(() => {});
  })();
</script>
</body>
</html>
