<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E2472B">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Смена · VKO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍔</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171A; --dim:rgba(20,23,26,.5); --line:rgba(20,23,26,.08);
    --bg:#FFF6F1; --card:#FFFFFF;
    --acc:#E2472B; --acc2:#F5B700; --accSoft:#FDE7E1;
    --ok:#2E8B47; --okSoft:#E5F4E9; --bad:#C1272D; --wait:#B9BEC4;
  }
  body.mo{ --acc:#8A5A34; --acc2:#D9A066; --accSoft:#F3E7DC; --bg:#FAF5F0; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:Inter,-apple-system,sans-serif; }
  #app{ max-width:480px; margin:0 auto; min-height:100vh; padding:16px 16px 96px; }
  h1,h2,h3{ margin:0; }
  .brand{ font-family:'Archivo Black',sans-serif; color:var(--acc); text-align:center; font-size:22px; letter-spacing:.5px; margin:4px 0 14px; }
  .brand small{ display:block; font-family:Inter; font-weight:600; font-size:12px; color:var(--dim); letter-spacing:0; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:10px; box-shadow:0 6px 18px -14px rgba(20,23,26,.35); }
  .row{ display:flex; align-items:center; gap:12px; }
  .between{ justify-content:space-between; }
  .dim{ color:var(--dim); } .sm{ font-size:13px; } .xs{ font-size:12px; }
  .b{ font-weight:700; } .xb{ font-weight:800; }
  .chip{ display:inline-block; background:var(--accSoft); color:var(--ink); border-radius:999px; padding:4px 10px; font-size:12px; font-weight:600; }
  .btn{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; border:0; border-radius:14px; padding:15px; font:700 16px Inter; cursor:pointer; background:var(--acc); color:#fff; box-shadow:0 10px 22px -12px var(--acc); }
  .btn.ghost{ background:#fff; color:var(--acc); border:1.5px solid var(--accSoft); box-shadow:none; }
  .btn.dark{ background:var(--ink); box-shadow:none; }
  .btn.sm{ padding:9px 12px; font-size:13px; border-radius:10px; width:auto; }
  .btn.ok{ background:var(--ok); box-shadow:none; } .btn.bad{ background:var(--bad); box-shadow:none; }
  .btn:active{ transform:scale(.98); }
  .ico{ width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; flex:none; }
  .list .item{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .list .item:last-child{ border-bottom:0; }
  .chev{ margin-left:auto; color:var(--dim); font-size:20px; }
  .bar{ height:6px; background:#F0F1F3; border-radius:4px; overflow:hidden; margin-top:6px; }
  .bar i{ display:block; height:100%; background:var(--acc); border-radius:4px; }
  .bar i.full{ background:var(--ok); }
  .sect{ font-size:12px; font-weight:700; letter-spacing:.6px; color:var(--dim); text-transform:uppercase; margin:18px 4px 8px; }
  .mark{ width:28px; height:28px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:15px; }
  .mark.ok{ background:var(--ok); } .mark.no{ background:#D3D6DA; } .mark.wait{ background:#fff; border:2px dashed var(--wait); color:var(--wait); }
  .metric{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .metric:last-child{ border-bottom:0; }
  .metric .r{ margin-left:auto; text-align:right; }
  .plus{ color:var(--ok); font-weight:800; } .zero{ color:var(--dim); font-weight:700; }
  .over{ color:var(--acc); font-size:11px; font-weight:700; }
  .hero{ background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 70%,var(--acc2))); color:#fff; border-radius:20px; padding:18px; margin:-16px -16px 14px; border-radius:0 0 22px 22px; }
  .hero .xs{ opacity:.85; }
  .big{ font-size:44px; font-weight:800; color:var(--acc); letter-spacing:-1px; text-align:center; }
  .three{ display:grid; grid-template-columns:repeat(3,1fr); text-align:center; border-top:1px dashed var(--line); margin-top:10px; padding-top:10px; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .gauge{ text-align:center; padding:14px 8px; }
  .gauge .lab{ font-weight:600; font-size:13px; margin-top:2px; }
  .pill{ display:inline-block; margin-top:8px; padding:5px 10px; border-radius:999px; font-size:12px; font-weight:700; background:var(--okSoft); color:var(--ok); }
  .pill.warn{ background:#FFF3D6; color:#9A6B00; } .pill.neg{ background:#FBE3E4; color:var(--bad); }
  .tabs{ position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); display:flex; justify-content:center; padding:6px 0 calc(6px + env(safe-area-inset-bottom)); z-index:5; }
  .tabs .in{ display:flex; width:100%; max-width:480px; }
  .tabs button{ flex:1; background:none; border:0; font:600 11px Inter; color:var(--dim); padding:4px 0; cursor:pointer; }
  .tabs button span{ display:block; font-size:22px; line-height:1.2; filter:grayscale(1); opacity:.6; }
  .tabs button.on{ color:var(--acc); } .tabs button.on span{ filter:none; opacity:1; }
  .seg{ display:flex; background:#fff; border:1px solid var(--line); border-radius:12px; padding:3px; margin-bottom:12px; overflow-x:auto; }
  .seg button{ flex:1; border:0; background:none; padding:8px 10px; border-radius:9px; font:600 13px Inter; color:var(--dim); cursor:pointer; white-space:nowrap; }
  .seg button.on{ background:var(--acc); color:#fff; }
  label.f{ display:block; margin:10px 0 4px; font-size:13px; font-weight:600; }
  input,select{ width:100%; font:500 16px Inter; padding:12px; border-radius:12px; border:1px solid rgba(20,23,26,.15); background:#fff; color:var(--ink); }
  input:focus,select:focus{ outline:2px solid var(--acc); border-color:transparent; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; color:var(--dim); font-weight:600; font-size:11px; text-transform:uppercase; padding:6px 4px; border-bottom:1px solid var(--line); }
  td{ padding:9px 4px; border-bottom:1px solid var(--line); }
  td.n,th.n{ text-align:right; white-space:nowrap; }
  .scroll{ overflow-x:auto; margin:0 -4px; }
  .back{ background:none; border:0; font:600 15px Inter; color:var(--acc); padding:4px 0 12px; cursor:pointer; }
  .modal{ position:fixed; inset:0; background:rgba(20,23,26,.45); display:flex; align-items:flex-end; justify-content:center; z-index:10; }
  .modal .sheet{ background:#fff; width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto; }
  .promo{ background:#FFF8E1; border:1px solid #F7E3A1; }
  .bell{ position:relative; }
  .bell b{ position:absolute; top:-6px; right:-8px; background:var(--bad); color:#fff; font-size:11px; border-radius:999px; padding:1px 6px; }
  .rank{ width:28px; height:28px; border-radius:50%; background:#F0F1F3; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex:none; }
  .rank.g1{ background:#F5B700; color:#fff; } .rank.g2{ background:#B9BEC4; color:#fff; } .rank.g3{ background:#C98A55; color:#fff; }
  .me{ background:var(--accSoft); border-radius:10px; }
  .grid-in{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .mrow{ display:grid; grid-template-columns:1.6fr .8fr .8fr; gap:6px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .mrow input{ padding:8px; font-size:14px; }
  .toast{ position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:12px; font-size:14px; font-weight:600; z-index:20; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
/* ============================================================
   Смена · VKO — приложение кассира/бариста
   Burger Heroes (гейты 25–26) и Мо Бар (гейты 29–30)
   Прототип: данные хранятся в localStorage браузера.
   ============================================================ */
const LS = 'vko_kassir_v2';
const MANAGER_PIN = '1234';
// премия кассира: % от личной выручки, повышенный — если выполнен план по выручке за смену
const DEFAULT_BONUS = {base:1.25, plan:2};

/* ---------- утилиты ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(n || 0).toLocaleString('ru-RU');
const rub = n => fmt(n) + ' ₽';
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const dayStr = ts => { const d = new Date(ts); return d.getDate() + ' ' + MONTHS[d.getMonth()] + ', ' + WD[d.getDay()]; };
const durStr = h => { const H = Math.floor(h), M = Math.round((h - H) * 60); return H + ' ч ' + M + ' мин'; };

const isoDate = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const weekStart = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return +d; };
const pctStr = v => String(v).replace('.', ',') + '%';

function toast(t){ const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 1800); }

/* ---------- стартовые данные ---------- */
function defaultMetrics(point){
  if (point === 'bh') return [
    {id:'rev',    name:'Выручка',            hint:'по твоим чекам',              type:'money', plan:60000, reward:0, step:5000, stepReward:0, icon:'📊', color:'#E2472B'},
    {id:'avg',    name:'Средний чек',        hint:'выручка / кол-во чеков',      type:'avg',   plan:780,   reward:0, step:20,   stepReward:0, icon:'🧾', color:'#5457E5'},
    {id:'drink',  name:'Напиток в чеке',     hint:'доля чеков с напитком',       type:'pct',   plan:65,    reward:0,  step:1,    stepReward:0,  icon:'🥤', color:'#2BA6DE', ask:'Чеков с напитком'},
    {id:'sauce',  name:'Соус или доп',       hint:'доля чеков с соусом/допом',   type:'pct',   plan:20,    reward:0,  step:1,    stepReward:0,  icon:'🥫', color:'#2E8B47', ask:'Чеков с соусом/допом'},
    {id:'dessert',name:'Закуска или десерт', hint:'фри, наггетсы, десерт',       type:'pct',   plan:20,    reward:0,  step:1,    stepReward:0,  icon:'🍟', color:'#F5B700', ask:'Чеков с закуской/десертом'},
    {id:'combo',  name:'Комбо',              hint:'доля чеков с комбо',          type:'pct',   plan:12,    reward:0,  step:1,    stepReward:0,  icon:'🍔', color:'#E2472B', ask:'Чеков с комбо'},
    {id:'size',   name:'Размер «побольше»',  hint:'напиток/фри большого размера',type:'pct',   plan:40,    reward:0,  step:1,    stepReward:0,  icon:'⬆️', color:'#8E5BD9', ask:'Чеков с апсайзом'},
    {id:'month',  name:'Бургер месяца',      hint:'позиция месяца, шт',          type:'count', plan:5,     reward:0,  step:1,    stepReward:0, icon:'⭐', color:'#F5B700', ask:'Продано бургеров месяца'},
    {id:'reviews',name:'Отзывы гостей',      hint:'по QR на тейбл-тенте',        type:'count', plan:3,     reward:0,  step:1,    stepReward:0, icon:'💬', color:'#E04B8B', ask:'Отзывов за смену'},
    {id:'script', name:'Скрипт сервиса — без замечаний', hint:'6 шагов, проверка управляющего', type:'flag', plan:1, reward:0, step:1, stepReward:0, icon:'🎯', color:'#14171A'},
  ];
  return [
    {id:'rev',    name:'Выручка',            hint:'по твоим чекам',              type:'money', plan:45000, reward:0, step:5000, stepReward:0, icon:'📊', color:'#8A5A34'},
    {id:'avg',    name:'Средний чек',        hint:'выручка / кол-во чеков',      type:'avg',   plan:650,   reward:0, step:20,   stepReward:0, icon:'🧾', color:'#5457E5'},
    {id:'size',   name:'Объём L',            hint:'доля напитков большого объёма',type:'pct',  plan:40,    reward:0,  step:1,    stepReward:0,  icon:'⬆️', color:'#8E5BD9', ask:'Чеков с объёмом L'},
    {id:'dessert',name:'Десерт к напитку',   hint:'доля чеков с десертом',       type:'pct',   plan:25,    reward:0,  step:1,    stepReward:0,  icon:'🥐', color:'#D9A066', ask:'Чеков с десертом'},
    {id:'syrup',  name:'Сироп / доп. шот',   hint:'доля чеков с допом',          type:'pct',   plan:20,    reward:0,  step:1,    stepReward:0,  icon:'🍯', color:'#2E8B47', ask:'Чеков с сиропом/шотом'},
    {id:'month',  name:'Напиток месяца',     hint:'позиция месяца, шт',          type:'count', plan:6,     reward:0,  step:1,    stepReward:0, icon:'⭐', color:'#F5B700', ask:'Продано напитков месяца'},
    {id:'reviews',name:'Отзывы гостей',      hint:'по QR на тейбл-тенте',        type:'count', plan:3,     reward:0,  step:1,    stepReward:0, icon:'💬', color:'#E04B8B', ask:'Отзывов за смену'},
    {id:'script', name:'Скрипт сервиса — без замечаний', hint:'6 шагов, проверка управляющего', type:'flag', plan:1, reward:0, step:1, stepReward:0, icon:'🎯', color:'#14171A'},
  ];
}

function seed(){
  const S = {
    points: {
      bh: {name:'Burger Heroes', place:'VKO · Терминал A · гейты 25–26', bonus:{...DEFAULT_BONUS}, sppPlan:14, metrics: defaultMetrics('bh')},
      mo: {name:'Мо Бар',        place:'VKO · Терминал A · гейты 29–30', bonus:{...DEFAULT_BONUS}, sppPlan:6,  metrics: defaultMetrics('mo')},
    },
    staff: [
      {id:'s1', name:'Иванова Алина',    role:'Кассир',  point:'bh', rate:300},
      {id:'s2', name:'Петров Даниил',    role:'Кассир',  point:'bh', rate:300},
      {id:'s3', name:'Смирнова Ксения',  role:'Кассир',  point:'bh', rate:300},
      {id:'s4', name:'Кузнецов Артём',   role:'Старший кассир', point:'bh', rate:330},
      {id:'s5', name:'Орлова Мария',     role:'Бариста', point:'mo', rate:310},
      {id:'s6', name:'Волков Егор',      role:'Бариста', point:'mo', rate:310},
      {id:'s7', name:'Лебедева Софья',   role:'Бариста', point:'mo', rate:310},
    ],
    shifts: [],
    pax: [],   // пассажиропоток МВЛ по неделям: {week:'YYYY-MM-DD' (понедельник), pax}
  };
  // демо-история за 14 дней (детерминированный рандом)
  let r = 7; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  const now = new Date();
  for (let d = 14; d >= 1; d--){
    for (const p of ['bh','mo']){
      const team = S.staff.filter(s => s.point === p);
      const pair = [team[d % team.length], team[(d + 1) % team.length]];
      pair.forEach((st, k) => {
        const start = new Date(now); start.setDate(now.getDate() - d); start.setHours(k ? 14 : 8, 0, 0, 0);
        const hours = 12 - (k ? 0 : rnd() * 0.5);
        const skill = 0.8 + ((st.id.charCodeAt(1) * 7) % 5) / 10 + rnd() * 0.15;
        const checks = Math.round((p === 'bh' ? 75 : 65) + rnd() * 30);
        const avg = (p === 'bh' ? 720 : 600) * (0.92 + skill * 0.1 + rnd() * 0.06);
        const facts = {rev: Math.round(checks * avg), checks};
        S.points[p].metrics.forEach(m => {
          if (m.type === 'pct')   facts[m.id] = Math.round(checks * (m.plan / 100) * (0.7 + skill * 0.35 * rnd() + rnd() * 0.15));
          if (m.type === 'count') facts[m.id] = Math.max(0, Math.round(m.plan * (0.5 + skill * 0.5 * rnd() + rnd() * 0.3)));
        });
        S.shifts.push({id: uid(), staffId: st.id, point: p, start: +start, end: +start + hours * 3600e3,
          status:'closed', facts, scriptOk: d === 1 ? null : rnd() > 0.2, fines: rnd() > 0.93 ? [{reason:'Опоздание', amount:200}] : []});
      });
    }
  }
  // демо-пассажиропоток за две прошлые недели
  const mon = weekStart(Date.now());
  S.pax.push({week: isoDate(mon - 14 * 864e5), pax: 71800}, {week: isoDate(mon - 7 * 864e5), pax: 74350});
  return S;
}

function load(){ try { return JSON.parse(localStorage.getItem(LS)); } catch(e){ return null; } }
function save(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){} }

let S = load() || seed();
let SESSION = (() => { try { return JSON.parse(localStorage.getItem(LS + '_s')) || {}; } catch(e){ return {}; } })();
function saveSession(){ try { localStorage.setItem(LS + '_s', JSON.stringify(SESSION)); } catch(e){} }
let UI = {tab:'home', view:null, param:null, mtab:'today', period:30, mpoint:'bh'};

/* ---------- расчёт смены ---------- */
const staffById = id => S.staff.find(s => s.id === id) || {name:'—', rate:0};
const metricsOf = p => S.points[p].metrics;

function factOf(m, f, scriptOk){
  const checks = f.checks || 0;
  switch (m.type){
    case 'money': return f.rev || 0;
    case 'avg':   return checks ? (f.rev || 0) / checks : 0;
    case 'pct':   return checks ? (f[m.id] || 0) / checks * 100 : 0;
    case 'count': return f[m.id] || 0;
    case 'flag':  return scriptOk == null ? null : (scriptOk ? 1 : 0);
  }
}
function fmtFact(m, v){
  if (v == null) return 'ждёт';
  if (m.type === 'money' || m.type === 'avg') return rub(v);
  if (m.type === 'pct') return Math.round(v) + ' %';
  if (m.type === 'flag') return v ? 'да' : 'есть замечания';
  return fmt(v) + ' шт';
}
function fmtPlan(m){
  if (m.type === 'money' || m.type === 'avg') return rub(m.plan);
  if (m.type === 'pct') return m.plan + ' %';
  if (m.type === 'flag') return 'проверка управляющего';
  return m.plan + ' шт';
}

function evalShift(sh){
  const st = staffById(sh.staffId);
  const end = sh.end || Date.now();
  const hours = Math.max(0, (end - sh.start) / 3600e3);
  const f = sh.facts || {};
  const rows = metricsOf(sh.point).map(m => {
    const v = factOf(m, f, sh.scriptOk);
    if (v == null) return {m, v, done:null, earn:0, over:0, prog:0};
    const done = v >= m.plan;
    const over = done && m.stepReward ? Math.floor((v - m.plan) / m.step + 1e-9) * m.stepReward : 0;
    return {m, v, done, earn: done ? m.reward + over : 0, over, prog: Math.min(1, m.plan ? v / m.plan : 0)};
  });
  const counted = rows.filter(x => x.done != null);
  const rating = counted.length ? Math.round(counted.reduce((a, x) => a + x.prog, 0) / counted.length * 100) : 0;
  // премия с выручки: базовый % или повышенный, если план по выручке выполнен
  const B = S.points[sh.point].bonus || DEFAULT_BONUS;
  const revRow = rows.find(x => x.m.type === 'money');
  const planMet = !!(revRow && revRow.done);
  const rate = planMet ? B.plan : B.base;
  const rev = f.rev || 0;
  const revBonus = Math.round(rev * rate / 100);
  const revPlan = revRow ? revRow.m.plan : 0;
  const lost = planMet ? 0 : Math.round(revPlan * B.plan / 100 - rev * B.base / 100);   // сколько дал бы план
  if (revRow) revRow.earn = revBonus;
  const extra = rows.reduce((a, x) => a + (x === revRow ? 0 : x.earn), 0);
  const bonus = revBonus + extra;
  const hoursPay = Math.round(hours * st.rate);
  const fines = (sh.fines || []).reduce((a, x) => a + (+x.amount || 0), 0);
  return {rows, rating, bonus, revBonus, extra, rate, planMet, lost, revPlan, B, hours, hoursPay, fines, total: hoursPay + bonus - fines,
    doneN: rows.filter(x => x.done).length, n: rows.length, avg: f.checks ? f.rev / f.checks : 0};
}
function ratingLabel(r){
  if (r >= 90) return ['Топ-смена 🔥',''];
  if (r >= 75) return ['Сильная смена',''];
  if (r >= 55) return ['Норм, можно лучше','warn'];
  return ['Есть куда расти','neg'];
}
function overallRating(staffId, excludeId){
  const list = S.shifts.filter(s => s.staffId === staffId && s.status === 'closed' && s.id !== excludeId)
    .sort((a, b) => b.start - a.start).slice(0, 10);
  if (!list.length) return null;
  return Math.round(list.reduce((a, s) => a + evalShift(s).rating, 0) / list.length);
}

/* ---------- SVG-спидометр ---------- */
function gauge(v, label, pill){
  const R = 46, cx = 60, cy = 58, a0 = Math.PI, a = Math.PI * (1 - Math.max(0, Math.min(100, v)) / 100);
  const p = ang => [cx + R * Math.cos(ang), cy - R * Math.sin(ang)];
  const [x0, y0] = p(a0), [x1, y1] = p(0), [xv, yv] = p(a);
  let ticks = '';
  for (let i = 0; i <= 10; i++){ const t = Math.PI * (1 - i / 10); const [ax, ay] = [cx + (R - 12) * Math.cos(t), cy - (R - 12) * Math.sin(t)]; const [bx, by] = [cx + (R - 8) * Math.cos(t), cy - (R - 8) * Math.sin(t)]; ticks += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#E3E5E8" stroke-width="1.5"/>`; }
  return `<div class="card gauge">
    <svg viewBox="0 0 120 68" width="140">
      <defs><linearGradient id="g${label.length}" x1="0" x2="1"><stop offset="0" stop-color="var(--acc)"/><stop offset="1" stop-color="var(--acc2)"/></linearGradient></defs>
      <path d="M${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1}" fill="none" stroke="var(--accSoft)" stroke-width="9" stroke-linecap="round"/>
      ${v > 0 ? `<path d="M${x0} ${y0} A${R} ${R} 0 0 1 ${xv} ${yv}" fill="none" stroke="url(#g${label.length})" stroke-width="9" stroke-linecap="round"/>` : ''}
      ${ticks}
      <text x="60" y="52" text-anchor="middle" font-size="22" font-weight="800" fill="var(--acc)" font-family="Inter">${v}</text>
      <text x="60" y="64" text-anchor="middle" font-size="8" fill="#888" font-family="Inter">из 100</text>
    </svg>
    <div class="lab">${label}</div>${pill || ''}</div>`;
}

  const rev = num('rev'), checks = num('checks');

  const facts = {rev, checks};
  for (const m of metricsOf(s.point)) if (m.type === 'pct' || m.type === 'count'){

    if (m.type === 'pct' && facts[m.id] > checks){ toast(`«${m.ask}» больше, чем чеков`); return; }

  save(); show('result', sh.id);
}

/* рейтинг */
function leaderboard(point, days){
  const from = Date.now() - days * 864e5;
  return S.staff.filter(s => s.point === point).map(s => {
    const sh = S.shifts.filter(x => x.staffId === s.id && x.status === 'closed' && x.start >= from);
    const ev = sh.map(evalShift);
    const rev = sh.reduce((a, x) => a + (x.facts.rev || 0), 0), checks = sh.reduce((a, x) => a + (x.facts.checks || 0), 0);
    const share = id => checks ? sh.reduce((a, x) => a + (x.facts[id] || 0), 0) / checks * 100 : 0;
    return {s, n: sh.length, rev, checks, avg: checks ? rev / checks : 0,
      rating: ev.length ? Math.round(ev.reduce((a, e) => a + e.rating, 0) / ev.length) : 0,
      bonus: ev.reduce((a, e) => a + e.bonus, 0), total: ev.reduce((a, e) => a + e.total, 0),

/* ---------- пассажиропоток и СПП ---------- */
const weekLabel = w => { const a = new Date(w), b = new Date(+a + 6 * 864e5); return a.getDate() + (a.getMonth() !== b.getMonth() ? ' ' + MONTHS[a.getMonth()].slice(0, 3) : '') + ' – ' + b.getDate() + ' ' + MONTHS[b.getMonth()].slice(0, 3); };
const paxOf = week => (S.pax.find(x => x.week === week) || {}).pax || 0;
function weekStats(point, weekTs){
  const sh = S.shifts.filter(x => x.point === point && x.status === 'closed' && x.start >= weekTs && x.start < weekTs + 7 * 864e5);
  const rev = sh.reduce((a, x) => a + (x.facts.rev || 0), 0), checks = sh.reduce((a, x) => a + (x.facts.checks || 0), 0);
  const pax = paxOf(isoDate(weekTs));
  return {rev, checks, pax, spp: pax ? rev / pax : null, conv: pax ? checks / pax * 100 : null, avg: checks ? rev / checks : 0};
}
function paxReminder(){
  const last = isoDate(weekStart(Date.now()) - 7 * 864e5);
  if (paxOf(last) || new Date().getDay() === 1) return '';
  return `<div class="card promo row" style="cursor:pointer" onclick="UI.mtab='spp';render()"><div style="font-size:24px">✈️</div><div><div class="b">Внеси пассажиропоток МВЛ</div><div class="sm dim">за неделю ${weekLabel(new Date(last))} — без него не посчитать СПП</div></div><span class="chev">›</span></div>`;
}

  const last = weekStats(p, cur - 7 * 864e5);

    <div class="card"><div class="xs dim">Конверсия</div><div class="xb" style="font-size:22px">${last.conv == null ? '—' : last.conv.toFixed(1).replace('.', ',') + '%'}</div><div class="xs dim">чеков на 100 пасс.</div></div></div>
  <div class="sect">Внести пассажиропоток МВЛ</div>
  <div class="card"><div class="two">
    <div><label class="f">Неделя (понедельник)</label><input id="px_week" type="date" value="${isoDate(cur - 7 * 864e5)}"></div>

  <div class="sect">По неделям · ${esc(P.name)}</div>
  <div class="card scroll"><table><tr><th>Неделя</th><th class="n">Пасс.</th><th class="n">Выручка</th><th class="n">СПП</th><th class="n">Конв.</th><th class="n">Ср. чек</th></tr>
  ${weeks.map(w => { const x = weekStats(p, w); return `<tr><td>${weekLabel(new Date(w))}</td><td class="n">${x.pax ? fmt(x.pax) : '<span class="dim">—</span>'}</td><td class="n">${fmt(x.rev)}</td>
    <td class="n b" style="color:${x.spp == null ? 'inherit' : x.spp >= P.sppPlan ? 'var(--ok)' : 'var(--bad)'}">${x.spp == null ? '—' : x.spp.toFixed(2).replace('.', ',')}</td>

  </table></div>
  <div class="card"><label class="f" style="margin-top:0">План СПП ${esc(P.name)}, ₽ на пассажира</label>
    <input type="number" step="0.1" value="${P.sppPlan}" onchange="S.points[UI.mpoint].sppPlan=+String(this.value).replace(',','.')||0;save();toast('Сохранено');render()"></div>

function savePax(){

      sh.scriptOk == null ? 'ждёт' : sh.scriptOk ? 'ок' : 'замечания', e.rating, e.hoursPay, e.bonus, e.fines, e.total];
  });
  const csv = '﻿' + [head, ...lines].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = `smeny_${p}_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
}

/* модалка */
function modal(html){ $('#modal').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${html}</div></div>`; }
function closeModal(){ $('#modal').innerHTML = ''; }

if (SESSION.staffId && !me()) SESSION = {};
render();
setInterval(() => { if (SESSION.staffId && !UI.view && UI.tab === 'home' && openShiftOf(SESSION.staffId)) render(); }, 60000);
</script>
